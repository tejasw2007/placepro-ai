{% extends "base.html" %}
{% block title %}Post Drive - PlacePro AI{% endblock %}
{% block content %}
<div style="max-width: 650px; margin: 1rem auto;">
  <div class="glass-card">
    <h2 style="margin-bottom: 0.5rem;">Create Campus Placement Drive</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Publish job criteria for students and AI compatibility matching.</p>

    <form method="POST">
      <div class="grid-2">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" name="company_name" class="form-control" placeholder="e.g. Infosys, TCS, Deloitte" required>
        </div>
        <div class="form-group">
          <label>Role / Designation</label>
          <input type="text" name="role_title" class="form-control" placeholder="e.g. Associate Data Analyst" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Package (LPA)</label>
          <input type="number" step="0.1" name="package_lpa" class="form-control" placeholder="4.5" required>
        </div>
        <div class="form-group">
          <label>Minimum Required CGPA</label>
          <input type="number" step="0.1" name="min_cgpa" class="form-control" placeholder="6.5" required>
        </div>
      </div>

      <div class="form-group">
        <label>Required Skills (Comma-separated)</label>
        <input type="text" name="required_skills" class="form-control" placeholder="Python, SQL, Excel, Flask" required>
      </div>

      <div class="form-group">
        <label>Application Deadline</label>
        <input type="date" name="deadline" class="form-control" required>
      </div>

      <div class="form-group">
        <label>Job Description & Responsibilities</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Detail the duties and candidate expectations..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Placement Drive</button>
    </form>
  </div>
</div>
{% endblock %}
