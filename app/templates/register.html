{% extends "base.html" %}
{% block title %}Register - PlacePro AI{% endblock %}
{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="glass-card">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Create Account</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.75rem; font-size: 0.9rem;">Join the PlacePro AI Placement Ecosystem</p>

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g., Alex Johnson" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="alex@college.edu" required>
      </div>
      <div class="form-group">
        <label>Portal Role</label>
        <select name="role" class="form-control">
          <option value="student">Student Portal</option>
          <option value="admin">Placement Admin Portal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan);">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
