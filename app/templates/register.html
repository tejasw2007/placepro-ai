{% extends "base.html" %}
{% block title %}Student Registration — PlacePro AI{% endblock %}
{% block content %}
<div style="max-width: 480px; margin: 2rem auto;" class="reveal-up">
  <div class="glass-card">
    <h2 style="margin-bottom: 0.4rem; text-align: center;">Create Student Account</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.75rem; font-size: 0.9rem;">
      Join the PlacePro AI Campus Placement Ecosystem
    </p>

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g., Tejas Wankhede" required>
      </div>
      <div class="form-group">
        <label>College Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
      </div>
      <div class="form-group">
        <label>Password (Min 6 characters)</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--blue); font-weight: 600; text-decoration: none;">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
