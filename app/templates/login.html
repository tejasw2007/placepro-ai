{% extends "base.html" %}
{% block title %}Login - PlacePro AI{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="glass-card">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Sign in to your student or administrative account</p>
    
    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Login</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-cyan);">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
